name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: irb
          POSTGRES_PASSWORD: irb
          POSTGRES_DB: irb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U irb" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://irb:irb@localhost:5432/irb_test
      DATABASE_URL: postgres://irb:irb@localhost:5432/irb_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oq-report
          path: validation/
      - run: npm run build
